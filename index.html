<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game API AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#060914;color:#f8fafc}body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:18px;background:radial-gradient(circle at 15% 10%,rgba(59,130,246,.18),transparent 35%),radial-gradient(circle at 85% 90%,rgba(124,58,237,.16),transparent 35%),#060914}.app{width:min(900px,100%);height:min(820px,94vh);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(148,163,184,.2);border-radius:26px;background:rgba(15,23,42,.82);backdrop-filter:blur(20px);box-shadow:0 30px 90px rgba(0,0,0,.45)}header{display:flex;align-items:center;gap:14px;padding:20px 22px;border-bottom:1px solid rgba(148,163,184,.15)}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 8px 25px rgba(37,99,235,.3);font-size:23px}.title h1{margin:0;font-size:19px}.title p{margin:3px 0 0;color:#94a3b8;font-size:13px}.status{margin-left:auto;display:flex;align-items:center;gap:7px;color:#94a3b8;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e}#messages{flex:1;overflow-y:auto;padding:28px 24px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}.welcome{margin:auto;text-align:center;max-width:520px}.welcome h2{font-size:30px;margin:0 0 10px}.welcome p{color:#94a3b8;line-height:1.6;margin:0}.msg{display:flex;gap:10px;max-width:82%;animation:appear .25s ease}.msg.user{align-self:flex-end;flex-direction:row-reverse}.avatar{flex:0 0 34px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:15px}.assistant .avatar{background:linear-gradient(135deg,#2563eb,#7c3aed)}.user .avatar{background:#334155}.bubble{padding:13px 15px;border-radius:17px;line-height:1.55;overflow-wrap:anywhere}.assistant .bubble{background:#172033;border:1px solid rgba(148,163,184,.12);border-top-left-radius:5px}.user .bubble{background:#2563eb;border-top-right-radius:5px}.error .bubble{background:#451a1a;color:#fecaca}.markdown{white-space:normal}.markdown>*:first-child{margin-top:0}.markdown>*:last-child{margin-bottom:0}.markdown p{margin:.3em 0 .8em}.markdown strong{font-weight:750;color:#fff}.markdown em{font-style:italic}.markdown h1,.markdown h2,.markdown h3{line-height:1.25;margin:1em 0 .5em}.markdown h1{font-size:1.35em}.markdown h2{font-size:1.2em}.markdown h3{font-size:1.08em}.markdown ul,.markdown ol{margin:.4em 0 .8em;padding-left:1.35em}.markdown li{margin:.25em 0}.markdown blockquote{margin:.6em 0;padding:.55em .85em;border-left:3px solid #64748b;color:#cbd5e1;background:rgba(15,23,42,.45);border-radius:6px}.markdown code{padding:.12em .35em;border-radius:6px;background:#0b1220;border:1px solid rgba(148,163,184,.12);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}.markdown pre{margin:.7em 0;overflow:auto;padding:12px 14px;border-radius:10px;background:#080d18;border:1px solid rgba(148,163,184,.12)}.markdown pre code{padding:0;border:0;background:transparent;white-space:pre}.markdown a{color:#93c5fd;text-decoration:underline;text-underline-offset:2px}.markdown hr{border:0;border-top:1px solid rgba(148,163,184,.18);margin:.9em 0}.typing{display:flex;align-items:center;gap:10px}.typing .bubble{display:flex;gap:5px;padding:15px 17px}.typing span{width:7px;height:7px;border-radius:50%;background:#94a3b8;animation:bounce 1.2s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}.image-loading .bubble{width:min(420px,78vw);padding:12px;background:#101827}.image-skeleton{position:relative;overflow:hidden;width:100%;aspect-ratio:1/1;border-radius:16px;background:linear-gradient(100deg,#182235 20%,#25334a 38%,#182235 60%);background-size:200% 100%;animation:shimmer 1.5s linear infinite}.image-skeleton::after{content:'Creating your image…';position:absolute;inset:0;display:grid;place-items:center;color:#cbd5e1;font-size:13px;letter-spacing:.02em;background:rgba(3,7,18,.14)}.generated-image{display:block;width:min(520px,78vw);max-width:100%;height:auto;border-radius:16px;border:1px solid rgba(148,163,184,.18);box-shadow:0 20px 50px rgba(0,0,0,.28)}.image-caption{margin-top:9px;color:#94a3b8;font-size:12px}.retry-status{margin-top:8px;color:#94a3b8;font-size:12px}@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}form{display:flex;gap:10px;padding:16px;border-top:1px solid rgba(148,163,184,.15);background:rgba(2,6,23,.35)}textarea{flex:1;resize:none;height:54px;max-height:140px;padding:15px 16px;border:1px solid #334155;border-radius:16px;outline:none;background:#0b1220;color:#fff;font:inherit;line-height:1.4}textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}button{width:58px;border:0;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 8px 22px rgba(37,99,235,.25)}button:hover{filter:brightness(1.1)}button:disabled{opacity:.55;cursor:wait}@media(max-width:600px){body{padding:0}.app{height:100vh;border-radius:0}.msg{max-width:92%}#messages{padding:22px 14px}.welcome h2{font-size:25px}}
</style>
</head>
<body>
<main class="app">
<header><div class="logo">✦</div><div class="title"><h1>Game API AI</h1><p>Your intelligent game API assistant</p></div><div class="status"><i class="dot"></i> Online</div></header>
<section id="messages"><div class="welcome" id="welcome"><h2>How can I help you?</h2><p>Ask me about Game API, current information, ideas, or ask me to create an image.</p></div></section>
<form id="chatForm"><textarea id="message" placeholder="Message Game API AI..." required></textarea><button id="send" type="submit" aria-label="Send">➤</button></form>
</main>
<script>
const API_URL='https://ai-backend-4-2lz9.onrender.com/api/chat';
const messagesEl=document.getElementById('messages'),form=document.getElementById('chatForm'),input=document.getElementById('message'),send=document.getElementById('send');
const history=[];
function removeWelcome(){const w=document.getElementById('welcome');if(w)w.remove()}
function scrollBottom(){messagesEl.scrollTop=messagesEl.scrollHeight}
function escapeHtml(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function renderInline(text){let s=escapeHtml(text);s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');s=s.replace(/(\*\*|__)(.+?)\1/g,'<strong>$2</strong>');s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');s=s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g,'$1<em>$2</em>');return s}
function renderMarkdown(text){
  const source=String(text||'').replace(/\r\n?/g,'\n').trim();
  if(!source)return '';
  const lines=source.split('\n');
  const out=[];let i=0;
  while(i<lines.length){
    const line=lines[i];
    if(/^\s*```/.test(line)){
      const language=(line.match(/^\s*```\s*([\w-]+)?/)||[])[1]||'';i++;
      const code=[];while(i<lines.length&&!/^\s*```/.test(lines[i])){code.push(lines[i]);i++}if(i<lines.length)i++;
      out.push('<pre><code'+(language?' class="language-'+escapeHtml(language)+'"':'')+'>'+escapeHtml(code.join('\n'))+'</code></pre>');continue;
    }
    if(/^\s*#{1,3}\s+/.test(line)){const match=line.match(/^\s*(#{1,3})\s+(.+)$/);const level=match[1].length;out.push('<h'+level+'>'+renderInline(match[2])+'</h'+level+'>');i++;continue}
    if(/^\s*[-*+]\s+/.test(line)){const items=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){items.push('<li>'+renderInline(lines[i].replace(/^\s*[-*+]\s+/,''))+'</li>');i++}out.push('<ul>'+items.join('')+'</ul>');continue}
    if(/^\s*\d+[.)]\s+/.test(line)){const items=[];while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){items.push('<li>'+renderInline(lines[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>');i++}out.push('<ol>'+items.join('')+'</ol>');continue}
    if(/^\s*>\s?/.test(line)){const quote=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){quote.push(renderInline(lines[i].replace(/^\s*>\s?/,'')));i++}out.push('<blockquote>'+quote.join('<br>')+'</blockquote>');continue}
    if(/^\s*---+\s*$/.test(line)){out.push('<hr>');i++;continue}
    if(!line.trim()){i++;continue}
    const paragraph=[line.trim()];i++;while(i<lines.length&&lines[i].trim()&&!/^\s*```/.test(lines[i])&&!/^\s*#{1,3}\s+/.test(lines[i])&&!/^\s*[-*+]\s+/.test(lines[i])&&!/^\s*\d+[.)]\s+/.test(lines[i])&&!/^\s*>\s?/.test(lines[i])&&!/^\s*---+\s*$/.test(lines[i])){paragraph.push(lines[i].trim());i++}out.push('<p>'+paragraph.map(renderInline).join('<br>')+'</p>');
  }
  return out.join('');
}
function addMessage(text,role){removeWelcome();const row=document.createElement('div');row.className=`msg ${role}`;const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'U':'✦';const bubble=document.createElement('div');bubble.className='bubble';if(role==='assistant'){bubble.classList.add('markdown');bubble.innerHTML=renderMarkdown(text)}else{bubble.textContent=text}row.append(avatar,bubble);messagesEl.appendChild(row);scrollBottom()}
function showTyping(){removeWelcome();const row=document.createElement('div');row.id='typing';row.className='msg assistant typing';row.innerHTML='<div class="avatar">✦</div><div class="bubble"><span></span><span></span><span></span></div>';messagesEl.appendChild(row);scrollBottom()}
function hideTyping(){document.getElementById('typing')?.remove()}
function showImageLoading(){removeWelcome();const row=document.createElement('div');row.id='imageLoading';row.className='msg assistant image-loading';row.innerHTML='<div class="avatar">✦</div><div class="bubble"><div class="image-skeleton"></div></div>';messagesEl.appendChild(row);scrollBottom()}
function hideImageLoading(){document.getElementById('imageLoading')?.remove()}
function updateImageRetryStatus(attempt){const loading=document.getElementById('imageLoading');if(!loading)return;let status=loading.querySelector('.retry-status');if(!status){status=document.createElement('div');status.className='retry-status';loading.querySelector('.bubble').appendChild(status)}status.textContent=`Warming up the image service… retry ${attempt} of 3`}
function addImage(image,caption='I created the image for you.'){removeWelcome();const row=document.createElement('div');row.className='msg assistant';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent='✦';const bubble=document.createElement('div');bubble.className='bubble';const img=document.createElement('img');img.className='generated-image';img.alt='AI generated image';img.src=image;const text=document.createElement('div');text.className='image-caption';text.textContent=caption;bubble.append(img,text);row.append(avatar,bubble);messagesEl.appendChild(row);scrollBottom()}
async function requestChat(payload,isImage){
  const retryableStatuses=new Set([502,503,504]);
  let lastError=null;
  for(let attempt=1;attempt<=3;attempt++){
    try{
      const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const data=await response.json().catch(()=>({}));
      if(response.ok)return data;
      const error=new Error(data.detail||`Request failed (${response.status})`);error.status=response.status;throw error;
    }catch(error){
      lastError=error;
      const retryable=retryableStatuses.has(error.status)||error.name==='TypeError';
      if(!retryable||attempt===3)throw error;
      if(isImage)updateImageRetryStatus(attempt);
      else{const typing=document.getElementById('typing');if(typing){let status=typing.querySelector('.retry-status');if(!status){status=document.createElement('div');status.className='retry-status';typing.querySelector('.bubble').appendChild(status)}status.textContent=`Warming up the AI service… retry ${attempt} of 3`}}
      await new Promise(resolve=>setTimeout(resolve,attempt*2500));
    }
  }
  throw lastError||new Error('Request failed.');
}
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message||send.disabled)return;addMessage(message,'user');history.push({role:'user',content:message});input.value='';send.disabled=true;const imageLike=/\b(generate|create|make|draw|design)\b[\s\S]*\b(image|picture|photo|illustration)\b/i.test(message)||/\b(image|picture|photo|illustration)\s+(of|for)\b/i.test(message);if(imageLike)showImageLoading();else showTyping();try{const data=await requestChat({message,history:history.slice(-7,-1)},imageLike);if(data.type==='image'&&data.image){hideImageLoading();hideTyping();addImage(data.image,data.reply||'I created the image for you.')}else{hideTyping();hideImageLoading();addMessage(data.reply||'I could not produce a response.','assistant');history.push({role:'assistant',content:data.reply||''})}}catch(error){hideTyping();hideImageLoading();addMessage(`Sorry, I couldn't complete that request. ${error.message}`,'error');history.pop()}finally{send.disabled=false;input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script>
</body>
</html>
